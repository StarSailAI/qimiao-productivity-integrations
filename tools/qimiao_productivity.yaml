      en_US: search_templates
  - value: prepare_task
    label:
      en_US: prepare_task
  - value: get_task_materials
    label:
      en_US: get_task_materials
  - value: quote_order
    label:
      en_US: quote_order
  - value: renew_quote
    label:
      en_US: renew_quote
  - value: create_order
    label:
      en_US: create_order
  - value: get_order
    label:
      en_US: get_order
  - value: wait_order
    label:
      en_US: wait_order
  - value: get_run_events
    label:
      en_US: get_run_events
  - value: respond_to_run
    label:
      en_US: respond_to_run
  - value: get_run_result
    label:
      en_US: get_run_result
  - value: request_change
    label:
      en_US: request_change
  - value: resume_order
    label:
      en_US: resume_order
  - value: cancel_order
    label:
      en_US: cancel_order
  - value: connect_account
    label:
      en_US: connect_account
  - value: get_connected_account
    label:
