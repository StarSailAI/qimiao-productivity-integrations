identity:
  name: qimiao_productivity
  author: starsailai
  label:
    en_US: Qimiao Productivity
    zh_Hans: 奇妙生产力
description:
  human:
    en_US: Discover file creation tools and templates, prepare materials, and retrieve
      existing task results.
    zh_Hans: 查询文件制作能力与模板、准备材料、跟进已有任务并获取成果。
  llm: Call the fixed Qimiao Productivity service. Start with list_tools to read current
    schemas. Supports discovery, free material preparation and existing task follow-up.
    Does not expose account access, order creation or payment operations.
parameters:
